name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/build_content.py
      - run: python scripts/validate.py
      # UMAP coordinates can differ across CPU implementations even with pinned
      # versions and seeds. CI checks all semantic outputs exactly and leaves the
      # exact projection check to the pinned Helios x86_64 environment.
      - run: python scripts/analyze_semantic_map.py --check --portable
      - name: Build and upload the Astro site
        uses: withastro/action@v5
      - run: python scripts/check_links.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
