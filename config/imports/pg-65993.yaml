transcriptionEvidence:
  sourceStatement: Archaic and colloquial spelling and punctuation was retained; missing or obscured punctuation was corrected.
  sourceLocation: Project Gutenberg transcriber's notes at the end of the pinned HTML.
  internalEditionEvidence: Six part title pages identify Horace Cox, London, 1908, with fortnightly issue statements where printed.
  deterministicNormalization:
    - omit Project Gutenberg header, footer, license and digital packaging
    - omit illustrations, captions and footnotes
    - collapse HTML whitespace within source blocks
    - render source headings, table rows and display lines as Markdown
    - remove a duplicated activity heading only where the manifest and parsed small-caps label identify it
  lexicalModernization: false
selection:
  scope: Explicitly described games in the verified 1908 text attributable to Baden-Powell.
  excludedGroups:
    - label: Seton-derived games
      reason: Separately attributed or expressly derived components require component-level review.
      examples: [Bang the Bear, Whale Hunt, Old Spotty-face, Quick Sight, Spot the Thief, Track the Assassin, Spider and Fly]
    - label: Other credited contributions
      reason: The accepted scope covers Baden-Powell's text, not contributions with another or unclear author.
      examples: [Morgan's Game, Boom-a-tata, Wild Animal Play]
    - label: Bare references and generic game lists
      reason: Names of ordinary sports and cross-references without standalone rules are not extractable activity records.
      examples: [Hockey, Rounders, Football, Basket Ball, Boxing, Wrestling, Rowing, Skipping, Ju-jitsu, The Empire card game]
    - label: Non-scouting games appendix
      reason: The book says an unspecified number were quoted from Social—to Save, so authorship is unresolved.
      examples: [Nobody's Airship, Artists, Target Ball, Circle Ball, Counting the Words, Animated Portraits, To Fit, City Chains, A Memory Game, Post, Number Groups, Their Weight, Basket Ball]
    - label: Non-game material
      reason: Practices, displays, plays, poems, songs, bibliographies and narrative text are outside this import's approved production kinds.
      examples: ["Debates, Trials, Etc.", "Scouts' War Dance"]
