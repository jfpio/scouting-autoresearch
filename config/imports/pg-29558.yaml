selection:
  scope: >-
    Individually bounded games within The Games on printed pages 291-319, subject to
    component attribution and cross-corpus duplicate checks.
  excludedGroups:
    - label: Baden-Powell-attributed range
      reason: The handbook explicitly says the games from Lion Hunting through Hare and Hounds are from General Baden-Powell.
      examples: [Lion Hunting, Plant Race, Flag Raiding, Kim's Game, Hare and Hounds]
    - label: Daniel Carter Beard contribution
      reason: The heading explicitly credits Daniel Carter Beard rather than Seton.
      examples: [Mumbly Peg]
    - label: Exact and near duplicates
      reason: Existing Scouting for Boys records are preferred when the text is the same; material variants require an explicit relation.
      examples: [Arctic Expedition, Dragging Race, Far and Near, Fire-lighting Race, Mountain Scouting, Knight Errantry]
    - label: Other handbook material
      reason: The approved component ends before Outdoor Athletic Standards and excludes illustrations, captions, advertisements and other chapters.
      examples: [Outdoor Athletic Standards]
